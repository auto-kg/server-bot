services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_GROUP_ID: ${ADMIN_GROUP_ID}
      MINI_APP_BASE_URL: ${MINI_APP_BASE_URL}
      NEW_CAR_CHANNEL_ID: ${NEW_CAR_CHANNEL_ID:-}
      BOT_NOTIFY_SECRET: ${BOT_NOTIFY_SECRET:-}
      BOT_NOTIFY_HOST: 0.0.0.0
      BOT_NOTIFY_PORT: 8080
    ports:
      - "${BOT_NOTIFY_HOST_BIND:-0.0.0.0}:${BOT_NOTIFY_HOST_PORT:-8091}:8080"
